<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142b2b">
  <title>ChatDB · 数据库智能助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="ChatDB 首页"><span class="brand-mark">C<span>▰</span></span><span>ChatDB<span class="brand-sub">数据库智能助手</span></span><span class="version">BETA</span></a>
      <button class="new-chat" id="new-chat"><span>＋</span> 新建对话 <kbd>Ctrl K</kbd></button>
      <div class="nav-label">工作空间</div>
      <nav class="workspace-nav">
        <button class="nav-item active" id="nav-chat"><span data-icon="chat"></span>智能对话<span class="nav-dot"></span></button>
        <button class="nav-item" data-panel="knowledge"><span data-icon="book"></span>知识库</button>
        <button class="nav-item" data-panel="database"><span data-icon="database"></span>数据库 & 查询</button>
        <button class="nav-item" data-panel="audit"><span data-icon="shield"></span>操作审计</button>
      </nav>
      <div class="history-heading"><span>最近对话</span><span data-icon="clock"></span></div>
      <label class="history-search"><span data-icon="search"></span><input id="history-search" placeholder="搜索历史对话" aria-label="搜索历史对话"></label>
      <div class="history-list" id="history-list"><div class="history-empty">还没有对话<br>从一个数据库问题开始</div></div>
      <div class="sidebar-bottom">
        <div class="database-status"><span class="status-dot"></span><div><strong id="db-label">示例业务数据库</strong><small>只读查询事务 · 查询保护已启用</small></div><span data-icon="lock"></span></div>
        <button class="profile" data-panel="settings"><span class="avatar">D</span><span><strong>开发者工作空间</strong><small>本地项目</small></span><span data-icon="settings"></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="展开菜单"><span data-icon="menu"></span></button><span class="breadcrumb">工作空间</span><span class="slash">/</span><strong id="page-title">智能对话</strong></div>
        <div class="topbar-right"><span class="model-chip"><span class="status-dot"></span><span id="model-label">本地演示</span></span><button class="icon-button" id="export" title="导出当前对话" aria-label="导出当前对话"><span data-icon="export"></span></button></div>
      </header>
      <section class="conversation" id="conversation" aria-label="对话内容">
        <div class="welcome" id="welcome">
          <div class="welcome-badge"><span class="sparkle">✦</span> YOUR DATABASE COPILOT</div>
          <h1>让数据库工作，<br><span>变得简单一点。</span></h1>
          <p class="welcome-sub">从一条 SQL 到一次故障排查，<br class="mobile-only">你的数据库专家随时在线。</p>
          <div class="capability-grid">
            <button class="capability" data-prompt="帮我查询最近7天各部门销售额" data-agent="sql"><span class="cap-icon mint" data-icon="code"></span><span class="card-arrow">↗</span><h3>SQL 编码与优化</h3><p>用自然语言编写 SQL<br>把想法变成可执行查询</p><span class="card-example">查询最近 7 天的部门销售额 →</span></button>
            <button class="capability" data-prompt="联合索引的最左前缀原则是什么？" data-agent="knowledge"><span class="cap-icon blue" data-icon="book"></span><span class="card-arrow">↗</span><h3>数据库知识问答</h3><p>检索规范与技术文档<br>让每个答案都有据可查</p><span class="card-example">了解联合索引的使用原则 →</span></button>
            <button class="capability" data-prompt="帮我检查当前数据库的表结构和索引设计" data-agent="design"><span class="cap-icon purple" data-icon="layers"></span><span class="card-arrow">↗</span><h3>表结构与索引设计</h3><p>结合真实 Schema<br>评估结构，完善设计</p><span class="card-example">检查当前业务库的表结构 →</span></button>
            <button class="capability" data-prompt="如何诊断一条慢 SQL？需要提供哪些资料？" data-agent="diagnosis"><span class="cap-icon orange" data-icon="pulse"></span><span class="card-arrow">↗</span><h3>性能与故障诊断</h3><p>分析执行计划与日志<br>寻找性能问题的线索</p><span class="card-example">开始一次慢 SQL 排查 →</span></button>
          </div>
          <div class="welcome-note"><span data-icon="shield"></span>只读查询保护<span class="note-divider">·</span>操作全程可追溯<span class="note-divider">·</span>知识来源可查</div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>
      <div class="composer-area">
        <div class="suggestions" id="suggestions"><span>试试这样问</span><button data-prompt="帮我查询最近7天各部门销售额">最近 7 天销售额</button><button data-prompt="金额字段应该使用什么类型？">金额字段怎么设计？</button><button data-prompt="如何排查索引失效导致的慢 SQL？">排查索引失效</button></div>
        <form class="composer" id="chat-form">
          <div class="attachment-list" id="attachment-list"></div>
          <textarea id="prompt" rows="2" maxlength="20000" placeholder="描述你的数据库问题，或者粘贴一段 SQL…" aria-label="输入数据库问题"></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools"><button type="button" class="icon-button" id="attach" aria-label="添加附件" title="上传文档或日志，最大 10MB"><span data-icon="paperclip"></span></button><span class="tool-separator"></span><label class="agent-select"><span class="sparkle">✦</span><select id="agent" aria-label="选择专家"><option value="auto">智能路由</option value="sql">SQL 编码</option><option value="knowledge">知识问答</option><option value="design">结构设计</option><option value="diagnosis">故障诊断</option></select></label></div>
            <div class="send-area"><span class="send-hint">Enter 发送 · Shift + Enter 换行</span><button type="submit" class="send-button" id="send" aria-label="发送消息"><span data-icon="arrow-up"></span></button></div>
          </div>
        </form>
        <div class="composer-footnote"><span id="mode-note">本地演示使用内置模板。连接模型后可进行通用 AI 对话。</span><span class="footnote-right">ChatDB v1.0</span></div>
      </div>
    </main>
  </div>
  <div class="panel-backdrop" id="panel-backdrop" hidden></div>
  <aside class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-header"><div><span class="eyebrow">WORKSPACE</span><h2 id="panel-title">知识库</h2></div><button class="icon-button" id="close-panel" aria-label="关闭面板"><span data-icon="close"></span></button></div><div class="panel-content" id="panel-content"></div></aside>
  <input type="file" id="file-input" hidden accept=".txt,.md,.log,.csv,.json,.sql,.pdf,.docx,.html">
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
